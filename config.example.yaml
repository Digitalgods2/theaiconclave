# The AI Conclave Switchboard configuration
# Copy to config.yaml and adjust for your machine.
# Values in .env override values here.

server:
  host: 127.0.0.1
  port: 8787
  # Non-loopback binding is refused unless allow_remote is true and a token
  # (16+ chars) is set here or through CONCLAVE_API_TOKEN.
  allow_remote: false
  api_token: null

database:
  path: null                    # null = repo data/ in development; packaged user-data root

logging:
  level: info             # debug | info | warn | error

# -----------------------------------------------------------------------------
# Orchestration knobs.
# -----------------------------------------------------------------------------
orchestration:
  worker_poll_interval_seconds: 2   # how often the worker checks for new tasks
  # Optional neutral seats; they must not also be conclave participants.
  judge_agent: null
  synthesis_agent: null

# -----------------------------------------------------------------------------
# DB retention policy per decision 0003.
# Operational trigger: db size OR terminal tasks retaining Tier-3 transcripts exceed budget.
# Selection: tier-based (decisions and unresolved dissent never auto-trim).
# -----------------------------------------------------------------------------
retention:
  enabled: true
  max_db_size_mb: 2048              # trim when SQLite + WAL exceed this (2 GB)
  max_completed_tasks: 1000         # OR when terminal tasks retaining Tier-3 transcripts exceed this
  min_task_age_days: 90             # never trim tasks newer than this
  check_interval_seconds: 21600     # 6 hours between retention passes
  # Opt-in: drop final_results for tasks already exported to disk
  # (the markdown export is the long-term archive). Off by default —
  # turn on once you trust your export workflow.
  trim_tier2_after_export: false

# -----------------------------------------------------------------------------
# Agent registry. Each entry maps a canonical agent name to the CLI it wraps.
# `enabled: false` keeps the adapter registered but causes is_available() to
# return false; the orchestrator surfaces this as agent_unavailable.
# -----------------------------------------------------------------------------
#
# Per-adapter command_path (DR0017): set to an absolute path of the CLI binary
# if you want the adapter to skip its built-in $PATH lookup entirely. Useful in packaged-app
# launches where the GUI process doesn't inherit your shell PATH, or when the
# CLI lives outside the usual install locations. Leave null (commented out) to
# fall back to the adapter's built-in command name. Applies to codex / claude-code / gemini.
# Example: command_path: "/usr/local/bin/codex"
#
agents:
  codex:
    enabled: true
    command_path: null              # absolute path override; null = use PATH
    model_slug: "openai/gpt-5.5"         # top-tier general flagship (set `model = "gpt-5.5"` in ~/.codex/config.toml to match)

  claude-code:
    enabled: true
    command_path: null              # absolute path override; null = use PATH
    model_slug: "anthropic/claude-opus-4.7"   # top-tier reasoning (run `/model opus` in Claude Code to match)

  gemini:
    # Retired by Google 2026-06-18 except on Code Assist Standard/Enterprise
    # licences. Superseded by the `antigravity` seat below.
    enabled: false
    command_path: null              # absolute path override; null = use PATH
    model_slug: "google/gemini-2.5-pro"   # OpenRouter slug used for pricing lookup when in API mode

  # Antigravity CLI (`agy`) — successor to the Gemini CLI, which Google retired
  # on 2026-06-18 for AI Pro / Ultra / free tiers. Read-only in deliberation via
  # `--mode plan`; the prompt is delivered over stdin as stream-json because
  # conclave prompts exceed the Windows command-line length limit.
  antigravity:
    enabled: true
    command_path: null              # absolute path override; null = use PATH
    args: []                        # extra flags appended verbatim (e.g. ["--sandbox"])
    model: "gemini-3.1-pro-high"    # `agy models` lists the slugs
    effort: null                    # low | medium | high; null = the CLI's default
    model_slug: "google/gemini-3.1-pro"   # OpenRouter slug used for pricing lookup only

  fake:
    enabled: true                   # used by tests; safe to leave on
    # Fake adapter is selected by tests; it does not invoke a command.

# -----------------------------------------------------------------------------
# Evidence acquisition. URL fetching is built in and provider-neutral. Search is
# optional: use an operator-selected API returning
# {"results": [{"url": "...", "title": "...", "snippet": "..."}]}.
# -----------------------------------------------------------------------------
evidence:
  enabled: true
  require_https: true
  max_urls_per_request: 5
  max_document_bytes: 1000000
  max_document_chars: 80000
  timeout_seconds: 12
  search_endpoint: null
  search_api_key_env: null
  search_api_key_header: Authorization

# -----------------------------------------------------------------------------
# OpenRouter — pluggable open-weight council seats (pay-per-token, no subscription).
#
# Each entry registers an extra agent in the dashboard's "New Task" checkbox
# list, alongside codex / antigravity / claude-code. These are non-frontier (well,
# somewhat) open-weight models — a different pair of eyes trained on different
# data. Pricing is metered but tiny: a conclave turn costs about $0.001–$0.02.
#
# Auth: set the OPENROUTER_API_KEY environment variable, OR store a key via the
# dashboard's Settings → API Keys panel (the env var wins; the stored key is the
# fallback). If neither, these seats appear but report "unavailable".
#
# Model slugs change as the catalog evolves — verify at https://openrouter.ai/models.
# `name` is the friendly council label; `model_slug` is the OpenRouter model id.
# data_collection: "deny" (default) keeps prompts off providers that retain/train
# on them — appropriate for code review. Set "allow" to opt back in.
# -----------------------------------------------------------------------------
openrouter:
  enabled: true
  endpoint: "https://openrouter.ai/api/v1"
  data_collection: deny
  models:
    # max_context_chars caps the prompt size; the adapter uses it to budget the
    # inlined sandbox. Set conservatively below each model's true token window
    # (code-heavy prompts can hit ~3 chars/token, worse than prose's ~4) — raise
    # in config.yaml if you need more headroom for a big codebase.
    #
    # tool_loop (DR0015): when true AND a task has a sandbox, the adapter
    # offers read_file / list_dir / glob tools to the model instead of
    # inlining the whole sandbox into the prompt. Originally shipped `false`
    # per seat (DR0015 v1) so each seat could be verified individually;
    # default flipped to `true` 2026-05-18 after all four configured seats
    # were observed emitting tool_calls cleanly on real tasks. Flip back to
    # `false` per seat if a particular model regresses.
    - name: deepseek
      model_slug: "deepseek/deepseek-v4-pro"   # DeepSeek V4 Pro — 1.6T MoE / 49B activated; built for advanced reasoning + coding
      max_context_chars: 1500000               # real limit ~1M tokens; conservative under 3-chars-per-token worst case
      tool_loop: true                          # verified 2026-05-17
    - name: glm
      model_slug: "z-ai/glm-4.6"               # Z.ai GLM — reasoning + agentic; verify slug
      max_context_chars: 400000                # real limit ~200K tokens
      tool_loop: true                          # verified 2026-05-18
    - name: qwen
      model_slug: "qwen/qwen3.6-plus"          # Alibaba Qwen 3.6 Plus — hybrid linear-attention + sparse-MoE reasoning tier
      max_context_chars: 1500000               # real limit ~1M tokens; conservative under 3-chars-per-token worst case
      tool_loop: true                          # verified 2026-05-17
    - name: kimi
      model_slug: "moonshotai/kimi-k2.6"       # Moonshot Kimi K2.6 — outside-axis voice (Chinese training data); strong long-context
      max_context_chars: 700000                # real limit ~262K tokens; ~2× the per-token cost of the others, still ~$0.005–$0.015/turn
      tool_loop: true                          # verified 2026-05-18
