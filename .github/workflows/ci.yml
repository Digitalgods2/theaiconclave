name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app clients tools
      - name: Lint critical Python errors
        run: python -m ruff check app clients tools tests
      - name: Type-check maintained boundaries
        run: python -m pyright
      - name: Check dashboard JavaScript
        run: python tools/check_javascript.py
      - name: Check landing build
        run: python tools/build_landing.py --check
      - name: Audit Python reachability
        run: python tools/audit_dead_code.py
      - name: Test
        run: python -m pytest -q
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke tests
        run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.os }}
          path: output/playwright/
          if-no-files-found: ignore
